# =====================================================================
# Arquivo compartilhado (dono: professor). Grupos NAO alteram.
# Usuario e senha do Oracle ficam em application-local.properties,
# que NAO vai para o Git (veja application-local.properties.exemplo).
# =====================================================================
spring.application.name=gestao-financeira
spring.profiles.default=local

# Oracle FIAP
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=rmXXXXXX
spring.datasource.password=sua_senha

# As tabelas sao criadas pelos scripts da pasta banco-de-dados.
# O Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
